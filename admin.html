<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Diesel — Panel de administrador</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.PD_CONFIG = { SUPABASE_URL:"https://kohpsobftjrxdjtnclpx.supabase.co", SUPABASE_ANON_KEY:"__PD_ANON_KEY__", SITE:"powerdiesel", STORE_BUCKET:"store", IMAGES_BUCKET:"product-images" };
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0A0A0C;--bg2:#121318;--card:#16171d;--line:#26272f;--txt:#EDEEF2;--mut:#9A9CA6;--red:#E11D2A;--red2:#B00812;--grn:#22c55e;--gold:#FBBF24;--grad:linear-gradient(135deg,#E11D2A,#B00812)}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
  a{color:#ff6b74}
  h1,h2,h3{font-family:Archivo,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 13px;font-family:inherit;font-size:14.5px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
  label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px;font-weight:600}
  .field{margin-bottom:14px}
  .btn{background:var(--grad);color:#fff;border:none;font-weight:800;padding:12px 20px;border-radius:99px;cursor:pointer;font-family:inherit;font-size:14.5px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:700}
  .btn.sm{padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.6;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  .msg{padding:11px 14px;border-radius:10px;font-size:14px;margin:10px 0;display:none}
  .msg.err{background:rgba(225,29,42,.12);border:1px solid rgba(225,29,42,.4);color:#ff8189;display:block}
  .msg.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#7de6a0;display:block}

  /* LOGIN */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;max-width:400px;width:100%}
  .login-card .brand{font-family:Archivo;font-weight:900;font-size:22px;text-align:center;margin-bottom:4px}
  .login-card .brand span{color:var(--red)}
  .login-card .sub{color:var(--mut);text-align:center;font-size:13.5px;margin-bottom:22px}

  /* TOPBAR */
  header{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .wrap{display:flex;align-items:center;gap:14px;padding:14px 18px}
  header .brand{font-family:Archivo;font-weight:900;font-size:18px}
  header .brand span{color:var(--red)}
  header .who{margin-left:auto;color:var(--mut);font-size:13px}
  .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:22px 0}
  .tabs button{background:none;border:none;color:var(--mut);font-family:Archivo;font-weight:700;font-size:15px;padding:10px 4px;margin-right:16px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--red)}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .toolbar h2{font-size:20px}
  .toolbar .btn{margin-left:auto}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
  .pill.on{background:rgba(34,197,94,.15);color:#7de6a0}
  .pill.off{background:rgba(154,156,166,.15);color:var(--mut)}
  .thumb{width:44px;height:44px;border-radius:8px;background:var(--bg2);object-fit:cover;border:1px solid var(--line)}
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .icon{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .icon.del:hover{border-color:var(--red);color:#ff8189}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 16px}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:560px;width:100%;margin:auto}
  .modal h3{font-size:19px;margin-bottom:16px}
  .filebox{border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--bg2)}
  .filebox .cur{font-size:12.5px;color:var(--mut);margin-top:6px;word-break:break-all}
  .muted{color:var(--mut);font-size:13px}
  .center{text-align:center;padding:40px 10px;color:var(--mut)}
  .hide{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-card">
    <div class="brand">POWER <span>DIESEL</span></div>
    <div class="sub">Panel de administrador</div>
    <div id="loginMsg" class="msg"></div>
    <form id="loginForm">
      <div class="field"><label>Correo</label><input type="email" id="liEmail" placeholder="hector@technicaldieseltop.net" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="liPass" placeholder="Tu contraseña"></div>
      <button class="btn" type="submit" id="liBtn" style="width:100%">Entrar</button>
    </form>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 6px"><div style="flex:1;height:1px;background:var(--line)"></div><span class="muted" style="font-size:12px">o</span><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <button class="btn ghost" id="magicBtn" style="width:100%">📧 Enviar enlace de acceso a mi correo</button>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:10px">Si no tienes o no recuerdas tu contraseña, usa el enlace de acceso: te llega un correo, le das clic y entras.</p>
  </div>
</div>

<!-- ADMIN -->
<div id="adminView" class="hide">
  <header><div class="wrap">
    <div class="brand">POWER <span>DIESEL</span> · Admin</div>
    <div class="who"><span id="whoEmail"></span> · <a href="#" id="logoutBtn">Salir</a></div>
  </div></header>

  <div class="wrap">
    <div class="tabs">
      <button data-tab="products" class="on">Productos</button>
      <button data-tab="orders">Órdenes</button>
    </div>

    <div id="tab-products">
      <div class="toolbar">
        <h2>Tus productos</h2>
        <button class="btn" id="newBtn">+ Nuevo producto</button>
      </div>
      <div id="prodMsg" class="msg"></div>
      <div id="prodList"><div class="center">Cargando…</div></div>
    </div>

    <div id="tab-orders" class="hide">
      <div class="toolbar"><h2>Órdenes de Power Diesel</h2></div>
      <div id="orderList"><div class="center">Cargando…</div></div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-bg" id="prodModal">
  <div class="modal">
    <h3 id="pmTitle">Nuevo producto</h3>
    <div id="pmMsg" class="msg"></div>
    <form id="prodForm">
      <input type="hidden" id="pId">
      <div class="field"><label>Título del producto *</label><input type="text" id="pTitle" placeholder="Ej: Tuning Stage 1 — Cummins ISX15" required></div>
      <div class="field"><label>Descripción</label><textarea id="pDesc" rows="3" placeholder="Describe el archivo, para qué sirve, compatibilidad…"></textarea></div>
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--bg2)">
        <div style="font-family:Archivo;font-weight:700;font-size:14px;color:var(--txt);margin-bottom:12px">🚚 Información del vehículo</div>
        <div class="row">
          <div class="field"><label>Marca del vehículo</label><input type="text" id="pvBrand" placeholder="Ej: Freightliner, Kenworth, Kubota…"></div>
          <div class="field"><label>Modelo</label><input type="text" id="pvModel" placeholder="Ej: Cascadia, T680…"></div>
        </div>
        <div class="row">
          <div class="field"><label>Motor</label><input type="text" id="pvEngine" placeholder="Ej: Cummins ISX15, DD15, 3.8L…"></div>
          <div class="field"><label>Tipo de motor</label><input type="text" id="pvEngineType" placeholder="Ej: Diésel, 6 cil…"></div>
        </div>
        <div class="row">
          <div class="field"><label>Transmisión</label><input type="text" id="pvTrans" placeholder="Ej: Automática, Manual, DT12…"></div>
          <div class="field"><label>Número de vehículo / VIN</label><input type="text" id="pvVin" placeholder="Ej: VIN o número de unidad"></div>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Tipo de archivo (categoría)</label>
          <select id="pCat">
            <option value="Tuning">Tuning</option>
            <option value="Delete">Delete</option>
            <option value="Originales">Originales</option>
            <option value="Software">Software</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div class="field"><label>Precio (USD)</label><input type="number" id="pPrice" min="0" step="0.01" placeholder="49.99"></div>
      </div>
      <div class="field">
        <label>Imagen del producto (opcional)</label>
        <div class="filebox"><input type="file" id="pImage" accept="image/*"><div class="cur" id="pImageCur"></div></div>
      </div>
      <div class="field">
        <label>Archivo descargable (el que recibe el cliente al comprar)</label>
        <div class="filebox"><input type="file" id="pFile"><div class="cur" id="pFileCur"></div></div>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" id="pPub" checked style="width:auto">
        <label for="pPub" style="margin:0">Publicado (visible en la tienda)</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn ghost" id="pmCancel" style="flex:0 0 auto">Cancelar</button>
        <button type="submit" class="btn" id="pmSave">Guardar producto</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  var cfg = window.PD_CONFIG, sb=null, me=null, editing=null, products=[];
  function q(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove('hide'); }
  function hide(el){ el.classList.add('hide'); }
  function money(c){ return '$'+(Number(c||0)/100).toFixed(2); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function msg(el,type,text){ el.className='msg '+type; el.textContent=text; if(!text) el.style.display='none'; }
  function slugify(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); }

  async function bootstrap(){
    if(cfg.SUPABASE_ANON_KEY.indexOf('__')!==0){ return true; }
    try{ var r=await fetch(cfg.SUPABASE_URL.replace(/\/+$/,'')+'/functions/v1/pd-config',{headers:{Accept:'application/json'}}); if(r.ok){ var j=await r.json(); if(j&&j.anonKey){ cfg.SUPABASE_ANON_KEY=j.anonKey; if(j.url)cfg.SUPABASE_URL=j.url; return true; } } }catch(e){}
    return cfg.SUPABASE_ANON_KEY.indexOf('__')!==0;
  }

  async function checkAdmin(email){
    try{ var r=await sb.from('admins').select('email').eq('email',email).maybeSingle(); return !!(r.data); }catch(e){ return false; }
  }

  async function start(){
    var ok=await bootstrap();
    if(!ok || !window.supabase){ msg(q('loginMsg'),'err','No se pudo conectar al sistema. Recarga la página.'); return; }
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    var handled=false;
    sb.auth.onAuthStateChange(function(evt, session){
      if(!handled && session && (evt==='SIGNED_IN' || evt==='INITIAL_SESSION')){ handled=true; try{ history.replaceState({},'',location.pathname); }catch(e){} afterLogin(session.user); }
    });
    var s=await sb.auth.getSession();
    if(!handled && s.data && s.data.session){ handled=true; afterLogin(s.data.session.user); }
  }

  async function afterLogin(user){
    var isAdmin = await checkAdmin(user.email);
    if(!isAdmin){ msg(q('loginMsg'),'err','Esta cuenta no tiene permiso de administrador.'); await sb.auth.signOut(); return; }
    me = user;
    q('whoEmail').textContent = user.email;
    hide(q('loginView')); show(q('adminView'));
    loadProducts();
  }

  q('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    msg(q('loginMsg'),'','');
    var email=q('liEmail').value.trim(), pass=q('liPass').value;
    if(!email){ msg(q('loginMsg'),'err','Escribe tu correo.'); return; }
    if(!pass){ msg(q('loginMsg'),'err','Escribe tu contraseña, o usa el botón de “Enviar enlace de acceso” de abajo.'); return; }
    var b=q('liBtn'); b.disabled=true; b.textContent='Entrando…';
    try{
      var r=await sb.auth.signInWithPassword({ email:email, password:pass });
      if(r.error) throw r.error;
      await afterLogin(r.data.user);
    }catch(err){
      var m=(err&&err.message)||'No se pudo entrar.';
      if(/Invalid login/i.test(m)) m='Correo o contraseña incorrectos. Si no tienes contraseña, usa el enlace de acceso de abajo.';
      msg(q('loginMsg'),'err',m);
    }finally{ b.disabled=false; b.textContent='Entrar'; }
  });

  q('magicBtn').addEventListener('click', async function(){
    msg(q('loginMsg'),'','');
    var email=q('liEmail').value.trim();
    if(!email){ msg(q('loginMsg'),'err','Escribe tu correo arriba primero.'); return; }
    var b=q('magicBtn'); b.disabled=true; var old=b.textContent; b.textContent='Enviando…';
    try{
      var r=await sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: location.origin + location.pathname, shouldCreateUser:false } });
      if(r.error) throw r.error;
      msg(q('loginMsg'),'ok','¡Listo! Te enviamos un enlace de acceso a '+email+'. Abre tu correo y dale clic al enlace para entrar. (Revisa también spam).');
    }catch(err){
      var m=(err&&err.message)||'';
      if(/not exist|user not found|Signups not allowed|not authorized/i.test(m)) m='No encontramos una cuenta con ese correo. Verifica que sea el correo de administrador.';
      else if(/rate|too many|seconds/i.test(m)) m='Espera un momento antes de pedir otro enlace.';
      else if(!m) m='No se pudo enviar el enlace. Intenta de nuevo.';
      msg(q('loginMsg'),'err',m);
    }finally{ b.disabled=false; b.textContent=old; }
  });

  q('logoutBtn').addEventListener('click', async function(e){ e.preventDefault(); await sb.auth.signOut(); location.reload(); });

  // tabs
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      var tab=btn.getAttribute('data-tab');
      q('tab-products').classList.toggle('hide', tab!=='products');
      q('tab-orders').classList.toggle('hide', tab!=='orders');
      if(tab==='orders') loadOrders();
    });
  });

  async function loadProducts(){
    var el=q('prodList'); el.innerHTML='<div class="center">Cargando…</div>';
    try{
      var r=await sb.from('products').select('*').eq('site',cfg.SITE).order('created_at',{ascending:false});
      if(r.error) throw r.error;
      products=r.data||[];
      if(!products.length){ el.innerHTML='<div class="center">Todavía no tienes productos. Dale a <b>“+ Nuevo producto”</b> para crear el primero.</div>'; return; }
      var rows=products.map(function(p){
        var img='';
        try{ var imgs=typeof p.images==='string'?JSON.parse(p.images):p.images; if(Array.isArray(imgs)&&imgs[0]){ var u=imgs[0]; if(u&&typeof u==='object')u=u.url||u.path; img=/^https?:/.test(u)?u:(cfg.SUPABASE_URL+'/storage/v1/object/public/'+cfg.IMAGES_BUCKET+'/'+u); } }catch(e){}
        return '<tr>'
          +'<td>'+(img?'<img class="thumb" src="'+esc(img)+'">':'<div class="thumb"></div>')+'</td>'
          +'<td><b>'+esc(p.title)+'</b><br><span class="muted">'+esc(p.category||'')+(p.file_path?' · 📄 archivo':' · <span style="color:#ff8189">sin archivo</span>')+'</span></td>'
          +'<td>'+money(p.price_cents)+'</td>'
          +'<td><span class="pill '+(p.published?'on':'off')+'">'+(p.published?'Publicado':'Oculto')+'</span></td>'
          +'<td><div class="acts"><button class="icon" data-edit="'+p.id+'">Editar</button><button class="icon del" data-del="'+p.id+'">Borrar</button></div></td>'
          +'</tr>';
      }).join('');
      el.innerHTML='<table><thead><tr><th></th><th>Producto</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
      Array.prototype.forEach.call(el.querySelectorAll('[data-edit]'),function(b){ b.addEventListener('click',function(){ openForm(b.getAttribute('data-edit')); }); });
      Array.prototype.forEach.call(el.querySelectorAll('[data-del]'),function(b){ b.addEventListener('click',function(){ delProduct(b.getAttribute('data-del')); }); });
    }catch(e){ el.innerHTML=''; msg(q('prodMsg'),'err','No se pudieron cargar los productos: '+(e.message||'')); }
  }

  function openForm(id){
    editing = id ? products.find(function(p){ return p.id===id; }) : null;
    q('pmTitle').textContent = editing?'Editar producto':'Nuevo producto';
    msg(q('pmMsg'),'','');
    q('pId').value = editing?editing.id:'';
    q('pTitle').value = editing?editing.title||'':'';
    q('pDesc').value = editing?editing.description||'':'';
    q('pCat').value = editing&&editing.category?editing.category:'Tuning';
    if(![].some.call(q('pCat').options,function(o){return o.value===q('pCat').value;})) q('pCat').value='Otros';
    q('pPrice').value = editing&&editing.price_cents!=null?(editing.price_cents/100):'';
    var sp = (editing && editing.specs) ? (typeof editing.specs==='string'?JSON.parse(editing.specs||'{}'):editing.specs) : {};
    q('pvBrand').value = sp.vehicle_brand||''; q('pvModel').value = sp.vehicle_model||'';
    q('pvEngine').value = sp.engine||''; q('pvEngineType').value = sp.engine_type||'';
    q('pvTrans').value = sp.transmission||''; q('pvVin').value = sp.vin||'';
    q('pPub').checked = editing?!!editing.published:true;
    q('pImage').value=''; q('pFile').value='';
    q('pImageCur').textContent = editing&&editing.images?('Imagen actual guardada'):'';
    q('pFileCur').textContent = editing&&editing.file_path?('Archivo actual: '+editing.file_path.split('/').pop()):'';
    q('prodModal').classList.add('open');
  }
  q('newBtn').addEventListener('click',function(){ openForm(null); });
  q('pmCancel').addEventListener('click',function(){ q('prodModal').classList.remove('open'); });

  async function uploadTo(bucket, file, folder){
    var safe = slugify(file.name.replace(/\.[^.]+$/,'')) || 'file';
    var ext = (file.name.match(/\.[^.]+$/)||[''])[0];
    var path = folder+'/'+Date.now()+'-'+safe+ext;
    var r = await sb.storage.from(bucket).upload(path, file, { upsert:false, cacheControl:'3600' });
    if(r.error) throw r.error;
    return path;
  }

  q('prodForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn=q('pmSave'); btn.disabled=true; var oldT=btn.textContent; btn.textContent='Guardando…';
    msg(q('pmMsg'),'','');
    try{
      var title=q('pTitle').value.trim(); if(!title) throw new Error('El título es obligatorio.');
      var rec = {
        title: title,
        description: q('pDesc').value.trim() || null,
        category: q('pCat').value,
        kind: 'file',
        price_cents: Math.round(parseFloat(q('pPrice').value||'0')*100) || 0,
        currency: 'usd',
        published: q('pPub').checked,
        site: cfg.SITE,
        specs: {
          vehicle_brand: q('pvBrand').value.trim(),
          vehicle_model: q('pvModel').value.trim(),
          engine: q('pvEngine').value.trim(),
          engine_type: q('pvEngineType').value.trim(),
          transmission: q('pvTrans').value.trim(),
          vin: q('pvVin').value.trim()
        }
      };
      // image upload
      var imgFile=q('pImage').files[0];
      if(imgFile){ var ipath=await uploadTo(cfg.IMAGES_BUCKET, imgFile, 'powerdiesel'); rec.images=[ cfg.SUPABASE_URL+'/storage/v1/object/public/'+cfg.IMAGES_BUCKET+'/'+ipath ]; }
      // file upload
      var dfile=q('pFile').files[0];
      if(dfile){ btn.textContent='Subiendo archivo…'; var fpath=await uploadTo(cfg.STORE_BUCKET, dfile, 'powerdiesel'); rec.file_path=fpath; }
      btn.textContent='Guardando…';
      var res;
      if(q('pId').value){ res=await sb.from('products').update(rec).eq('id',q('pId').value).eq('site',cfg.SITE).select(); }
      else { rec.slug = slugify(title)+'-'+String(Date.now()).slice(-5); res=await sb.from('products').insert(rec).select(); }
      if(res.error) throw res.error;
      q('prodModal').classList.remove('open');
      loadProducts();
    }catch(err){
      msg(q('pmMsg'),'err','No se pudo guardar: '+(err.message||err));
    }finally{ btn.disabled=false; btn.textContent=oldT; }
  });

  async function delProduct(id){
    var p=products.find(function(x){ return x.id===id; });
    if(!confirm('¿Borrar "'+(p?p.title:'este producto')+'"? Esta acción no se puede deshacer.')) return;
    try{
      var r=await sb.from('products').delete().eq('id',id).eq('site',cfg.SITE);
      if(r.error) throw r.error;
      loadProducts();
    }catch(e){ msg(q('prodMsg'),'err','No se pudo borrar: '+(e.message||'')); }
  }

  async function loadOrders(){
    var el=q('orderList'); el.innerHTML='<div class="center">Cargando…</div>';
    try{
      var r=await sb.from('purchases').select('created_at,email,amount_cents,product_id,products(title)').eq('site',cfg.SITE).order('created_at',{ascending:false}).limit(200);
      if(r.error) throw r.error;
      var list=r.data||[];
      if(!list.length){ el.innerHTML='<div class="center">Todavía no hay ventas registradas.</div>'; return; }
      el.innerHTML='<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Monto</th></tr></thead><tbody>'+list.map(function(o){
        var d=o.created_at?new Date(o.created_at).toLocaleString():'';
        return '<tr><td>'+esc(d)+'</td><td>'+esc(o.email||'')+'</td><td>'+esc((o.products&&o.products.title)||'')+'</td><td>'+money(o.amount_cents)+'</td></tr>';
      }).join('')+'</tbody></table>';
    }catch(e){ el.innerHTML='<div class="center">No se pudieron cargar las órdenes.</div>'; }
  }

  q('pImage').addEventListener('change',function(){ q('pImageCur').textContent=this.files[0]?('Nueva imagen: '+this.files[0].name):''; });
  q('pFile').addEventListener('change',function(){ q('pFileCur').textContent=this.files[0]?('Nuevo archivo: '+this.files[0].name):''; });

  start();
})();
</script>
